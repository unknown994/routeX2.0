<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Add Locations - RouteX</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
font-family:Arial, sans-serif;
text-align:center;
background:#f4f6f8;
}

h1{
margin-top:30px;
}

#mapContainer{
position:relative;
display:inline-block;
margin-top:20px;
}

#mapImage{
width:900px;
max-width:100%;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.marker{
position:absolute;
width:14px;
height:14px;
background:red;
border-radius:50%;
transform:translate(-50%,-50%);
cursor:pointer;
}

</style>

</head>

<body>

<h1>Mark Important Locations</h1>

<input type="file" id="mapUpload" accept="image/*">

<br><br>

<div id="mapContainer">

<img id="mapImage" src="images/campus-map.png">

</div>

<script src="js/admin.js"></script>

</body>

</html>
