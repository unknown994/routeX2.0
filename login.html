<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - RouteX</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav>
<div class="logo">📍 Route<span>X</span></div>

<div class="nav-links">
<a href="index.html">Home</a>
<a href="register.html">Register</a>
</div>
</nav>


<div class="container auth-container">

<div class="card">

<h2 class="text-center" style="margin-bottom:1.5rem;">Welcome Back</h2>

<div id="alert-box"></div>

<form id="login-form">

<div class="form-group">
<label>Username</label>
<input type="text" id="username" placeholder="Enter your username" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password" placeholder="Enter your password" required>
</div>

<button type="submit" id="login-btn">Login</button>

</form>

<p class="text-center mt-4">
Don't have an account?
<a href="register.html" style="color:var(--primary);">Register here</a>
</p>

</div>

</div>


<script src="auth.js"></script>

<script>

/* Redirect if already logged in */

document.addEventListener("DOMContentLoaded",()=>{

if(Auth.isAuthenticated()){

const user=Auth.getCurrentUser();

if(user.role==="admin"){
window.location.href="admin.html";
}else{
window.location.href="dashboard.html";
}

}

});


const form=document.getElementById("login-form");
const alertBox=document.getElementById("alert-box");
const loginBtn=document.getElementById("login-btn");


form.addEventListener("submit",(e)=>{

e.preventDefault();

alertBox.innerHTML="";

const username=document.getElementById("username").value.trim();
const password=document.getElementById("password").value;

loginBtn.disabled=true;
loginBtn.textContent="Logging in...";

const result=Auth.login(username,password);


if(result.success){

alertBox.innerHTML='<div class="alert alert-success">Login successful! Redirecting...</div>';

setTimeout(()=>{

const user=Auth.getCurrentUser();

if(user.role==="admin"){
window.location.href="admin.html";
}else{
window.location.href="dashboard.html";
}

},1000);

}else{

alertBox.innerHTML=`<div class="alert alert-error">${result.msg}</div>`;

loginBtn.disabled=false;
loginBtn.textContent="Login";

}

});

</script>

</body>
</html>
