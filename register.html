<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - RouteX</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav>
<div class="logo">📍 Route<span>X</span></div>

<div class="nav-links">
<a href="index.html">Home</a>
<a href="login.html">Login</a>
</div>
</nav>


<div class="container auth-container">

<div class="card">

<h2 class="text-center" style="margin-bottom:1.5rem;">Create Account</h2>

<div id="alert-box"></div>

<form id="register-form">

<div class="form-group">
<label>Username</label>
<input type="text" id="username" placeholder="Choose a username" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" id="password" placeholder="Choose a password" required>
</div>

<div class="form-group">
<label>Confirm Password</label>
<input type="password" id="confirm-password" placeholder="Confirm your password" required>
</div>

<button type="submit" id="register-btn">Register</button>

</form>

<p class="text-center mt-4">
Already have an account?
<a href="login.html" style="color:var(--primary);">Login here</a>
</p>

</div>

</div>


<script src="auth.js"></script>

<script>

/* Redirect if already logged in */

document.addEventListener("DOMContentLoaded",()=>{

if(Auth.isAuthenticated()){

const user=Auth.getCurrentUser();

if(user.role==="admin"){
window.location.href="admin.html";
}else{
window.location.href="dashboard.html";
}

}

});


const form=document.getElementById("register-form");
const alertBox=document.getElementById("alert-box");
const registerBtn=document.getElementById("register-btn");

form.addEventListener("submit",(e)=>{

e.preventDefault();

alertBox.innerHTML="";

const username=document.getElementById("username").value.trim();
const password=document.getElementById("password").value;
const confirmPassword=document.getElementById("confirm-password").value;

if(password!==confirmPassword){

alertBox.innerHTML='<div class="alert alert-error">Passwords do not match</div>';
return;

}

registerBtn.disabled=true;
registerBtn.textContent="Creating account...";

const result=Auth.register(username,password);

if(result.success){

alertBox.innerHTML=`<div class="alert alert-success">${result.msg}</div>`;

setTimeout(()=>{

window.location.href="login.html";

},1500);

}else{

alertBox.innerHTML=`<div class="alert alert-error">${result.msg}</div>`;

registerBtn.disabled=false;
registerBtn.textContent="Register";

}

});

</script>

</body>
</html>
